name: Deploy PWA to GitHub Pages

# Publishes the Threadboard PWA (clothes-designer/) to GitHub Pages.
# The clothes-designer folder is uploaded as the site root, so the app is
# served at https://<owner>.github.io/<repo>/ with no extra path segment.

on:
  push:
    branches: [main]
    paths:
      - 'clothes-designer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages (enables Pages if not already on)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the PWA as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: clothes-designer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
