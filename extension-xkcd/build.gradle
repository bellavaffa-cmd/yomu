plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yomu.reader.extension.xkcd'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yomu.reader.extension.xkcd'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // All provided by the host (Yomu) at runtime — not packaged into the extension.
    compileOnly project(':extension-api')
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
    // org.json is part of the Android framework — available at runtime for free.
}
