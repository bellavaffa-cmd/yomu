plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yomu.reader.extension.sample'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yomu.reader.extension.sample'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Provided by the host (Yomu) at runtime — must NOT be packaged into the extension.
    compileOnly project(':extension-api')
}
